packages:
  - apps/*
  - packages/*

engineStrict: true
strictPeerDependencies: true
dedupePeerDependents: true
resolvePeersFromWorkspaceRoot: true
saveExact: true
workspaceConcurrency: 999

allowBuilds:
  "@tailwindcss/oxide": true
  aws-sdk: true
  bcrypt: true
  better-sqlite3: false
  esbuild: true
  sharp: true
  unrs-resolver: true
